<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地址联想-旧版表单</title>
  <style>
    :root {
      --ink:#2c2e3b;
      --muted:#62657a;
      --line:#e1e3e8;
      --yellow:#ffe100;
      --surface:#ffffff;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body {
      margin:0; display:grid; place-items:center; background:#f3f4f7;
      color:var(--ink); font-family:Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .phone {
      position:relative; width:375px; min-height:812px; overflow:hidden; display:flex; flex-direction:column;
      background:var(--surface); border-radius:20px; box-shadow:0 14px 36px rgba(34, 39, 55, .09);
    }
    .status {
      height:48px; padding:15px 26px 0; display:flex; justify-content:space-between; align-items:flex-start;
      font-size:15px; line-height:18px; font-weight:600;
    }
    .status-icons { display:flex; align-items:center; gap:7px; height:16px; }
    .nav {
      height:48px; padding:0 17px; display:flex; align-items:center; gap:9px;
    }
    .nav__back, .nav__icon { padding:0; border:0; background:transparent; color:var(--ink); display:grid; place-items:center; }
    .nav__back { width:16px; height:28px; }
    .nav__title { font-size:17px; line-height:22px; font-weight:500; }
    .nav__spacer { flex:1; }
    .nav__icon { width:28px; height:28px; margin-left:8px; color:#62657a; }
    .progress { height:26px; margin:0 15px; display:flex; align-items:center; }
    .progress__track { width:100%; height:2px; border-radius:2px; background:#e7e7e8; overflow:hidden; }
    .progress__fill { display:block; width:42%; height:100%; background:var(--ink); border-radius:inherit; }
    main { flex:1; min-height:0; padding:0 15px 16px; overflow:auto; }
    h1 { margin:11px 0 18px; font-size:22px; line-height:29px; font-weight:400; letter-spacing:.05px; }
    .proof-card {
      width:100%; min-height:66px; padding:12px; display:flex; align-items:center; gap:10px;
      border:1px solid var(--line); border-radius:8px; background:#fff; text-align:left; color:var(--ink);
    }
    .proof-card__copy { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
    .proof-card__title { font-size:15px; line-height:20px; font-weight:500; }
    .proof-card__desc { font-size:13px; line-height:18px; color:var(--muted); }
    .proof-card__arrow { flex:0 0 auto; color:#62657a; }
    form { margin-top:18px; display:flex; flex-direction:column; gap:16px; }
    .field {
      height:48px; position:relative; display:flex; align-items:center; padding:0 16px;
      border:1px solid var(--line); border-radius:8px; background:#fff;
      transition:border-color .16s ease, box-shadow .16s ease;
    }
    .field:focus-within { border-color:var(--yellow); box-shadow:0 0 0 3px rgba(255, 225, 0, .19); }
    input, select {
      width:100%; min-width:0; padding:0; border:0; outline:0; background:transparent;
      color:var(--ink); font:500 16px/20px inherit;
    }
    input::placeholder { color:var(--muted); opacity:1; }
    .field--phone { gap:12px; }
    .country-code { display:flex; align-items:center; gap:8px; flex:0 0 auto; padding:0; border:0; background:transparent; color:var(--ink); font:500 16px/20px inherit; cursor:pointer; }
    .country-code svg { color:#9aa0aa; }
    .field__divider { width:1px; height:18px; flex:0 0 auto; background:var(--line); }
    .field--select { color:var(--muted); overflow:hidden; font-family:inherit; text-align:left; cursor:pointer; }
    .field--select span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    footer { padding:12px 15px 28px; display:flex; gap:12px; }
    .button {
      height:48px; border-radius:8px; border:1px solid #d6d8dc; background:#fff; color:#111318;
      font:600 16px/20px inherit; cursor:pointer;
    }
    .button--previous { width:132px; }
    .button--continue { flex:1; border-color:var(--yellow); background:var(--yellow); color:var(--ink); }
    .home { position:absolute; left:50%; bottom:8px; width:139px; height:5px; border-radius:3px; background:#000; transform:translateX(-50%); }
    .overlay { position:absolute; inset:0; z-index:10; display:flex; align-items:flex-end; background:rgba(0,0,0,.45); opacity:0; visibility:hidden; transition:opacity .18s ease; }
    .overlay.open { opacity:1; visibility:visible; }
    .sheet { width:100%; max-height:90%; overflow:auto; padding:8px 15px; border-radius:16px 16px 0 0; background:#fff; transform:translateY(100%); transition:transform .36s cubic-bezier(.32,.72,0,1); }
    .overlay.open .sheet { transform:translateY(0); }
    .sheet__handle { width:35px; height:4px; margin:0 auto; border-radius:2px; background:#e0e0e0; }
    .sheet h2 { margin:24px 0 0; font-size:20px; line-height:23px; font-weight:500; }
    .sheet p { margin:6px 0 0; color:var(--muted); font-size:14px; line-height:20px; }
    .upload-box { width:100%; margin-top:20px; padding:24px 16px; border:1.5px dashed var(--line); border-radius:8px; background:#fafbfc; color:var(--ink); font:inherit; text-align:center; cursor:pointer; }
    .upload-box strong,.upload-box span { display:block; }.upload-box strong { font-size:14px; }.upload-box span { margin-top:5px; color:var(--muted); font-size:12px; }
    .proof-result { display:none; margin-top:20px; padding:16px; border-radius:8px; background:#f8f9fb; }.proof-result small,.proof-result strong,.proof-result span { display:block; }.proof-result small,.proof-result span { color:var(--muted); }.proof-result strong { margin-top:4px; font-size:16px; }.proof-result span { margin-top:4px; font-size:13px; }
    .proof-actions { display:none; gap:8px; margin-top:20px; }.proof-actions button { height:44px; border-radius:8px; font:600 14px/20px inherit; cursor:pointer; }.proof-actions .outline { width:120px; border:1px solid var(--line); background:#fff; }.proof-actions .apply { flex:1; border:0; background:var(--yellow); }
    .proof-sheet.ready .upload-box { display:none; }.proof-sheet.ready .proof-result,.proof-sheet.ready .proof-actions { display:block; }.proof-sheet.ready .proof-actions { display:flex; }
    .address-sheet { min-height:42%; }.address-sheet .field { margin-top:12px; }.address-sheet .input-label { position:absolute; left:16px; top:50%; color:var(--muted); pointer-events:none; transform:translateY(-50%); }.address-sheet .field input:not(:placeholder-shown) + .input-label { opacity:0; }
    .suggestions { display:none; margin-top:8px; }.suggestions.show { display:block; }.suggestion { width:100%; padding:13px 0; border:0; border-top:1px solid rgba(0,0,0,.06); background:#fff; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }.suggestion b,.suggestion span { display:block; }.suggestion b { font-size:14px; }.suggestion span { margin-top:3px; color:var(--muted); font-size:12px; }
    .choice { width:100%; display:flex; align-items:center; justify-content:space-between; padding:15px 0; border:0; border-top:1px solid rgba(0,0,0,.06); background:#fff; color:var(--ink); font:16px/20px inherit; text-align:left; cursor:pointer; }.choice:first-of-type { margin-top:16px; }.choice b { opacity:0; }.choice.active b { opacity:1; }.pickable { cursor:pointer; }
    @media (max-width:375px) {
      body { display:block; background:#fff; }
      .phone { width:100%; min-height:100dvh; border-radius:0; box-shadow:none; }
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="Address Information">
    <header class="status">
      <span>9:41</span>
      <span class="status-icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect y="7" width="3" height="5" rx=".6" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx=".6" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx=".6" fill="currentColor"/><rect x="15" y="1" width="3" height="11" rx=".6" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4c3-3 11-3 14 0M3.5 6.5c2.5-2 6.5-2 9 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="9.3" r="1.3" fill="currentColor"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".8" y="1.5" width="23" height="9" rx="2.4" stroke="currentColor" stroke-opacity=".45"/><rect x="24.8" y="4.4" width="1.2" height="3.6" rx=".6" fill="currentColor" fill-opacity=".45"/><rect x="2.5" y="3.1" width="18" height="5.8" rx="1.3" fill="currentColor"/></svg>
      </span>
    </header>
    <nav class="nav" aria-label="Account navigation">
      <button class="nav__back" aria-label="Back"><svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1.5 2 9l7.5 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="nav__title">Open Account</span>
      <span class="nav__spacer"></span>
      <button class="nav__icon" aria-label="Customer service"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5.3 13.4v-1.1a6.7 6.7 0 0 1 13.4 0v1.1M5.3 13.4H4.8A1.8 1.8 0 0 0 3 15.2v1.4c0 1 .8 1.8 1.8 1.8h.9v-5Zm13.4 0h.5c1 0 1.8.8 1.8 1.8v1.4c0 1-.8 1.8-1.8 1.8h-.9v-5ZM18.7 18.4c0 1.3-1.1 2.4-2.4 2.4H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav__icon" aria-label="Refresh"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0 1.2 4.2M20 4v7h-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
    <div class="progress" aria-hidden="true"><span class="progress__track"><span class="progress__fill"></span></span></div>
    <main>
      <h1>Address Information</h1>
      <button class="proof-card" id="proofCard" type="button">
        <span class="proof-card__copy"><span class="proof-card__title">Use proof of address</span><span class="proof-card__desc">Upload a document to fill in your address</span></span>
        <svg class="proof-card__arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m6.8 3.5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <form>
        <label class="field"><input type="email" placeholder="Email" aria-label="Email"></label>
        <label class="field field--phone"><button class="country-code" id="countryCode" type="button">+86 <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m4 5.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="field__divider"></span><input type="tel" placeholder="Phone Number" aria-label="Phone Number"></label>
        <label class="field"><input inputmode="numeric" placeholder="ID Number" aria-label="ID Number"></label>
        <button class="field field--select" id="reason" type="button"><span>Reason for different phone and residence regions</span></button>
        <label class="field"><input inputmode="numeric" placeholder="Post Code" aria-label="Post Code"></label>
        <label class="field"><input id="address" placeholder="Permanent Residence Address" aria-label="Permanent Residence Address"></label>
      </form>
    </main>
    <footer><button type="button" class="button button--previous">Previous</button><button type="button" class="button button--continue">Continue</button></footer>
    <div class="home" aria-hidden="true"></div>
    <section class="overlay" id="proofOverlay"><div class="sheet proof-sheet"><div class="sheet__handle"></div><h2>Proof of address</h2><p>Upload a document and we’ll find the address for you.</p><button class="upload-box" id="proofUpload" type="button"><strong>Upload proof of address</strong><span>Bank statement, utility bill or government letter</span></button><div class="proof-result"><small>Address found</small><strong>21 Queen Street, Auckland CBD</strong><span>Auckland 1010 · New Zealand</span></div><div class="proof-actions"><button class="outline" id="searchManual" type="button">Search manually</button><button class="apply" id="applyAddress" type="button">Use this address</button></div></div></section>
    <section class="overlay" id="addressOverlay"><div class="sheet address-sheet"><div class="sheet__handle"></div><h2>Residential address</h2><label class="field"><input id="addressSearch" placeholder=" " autocomplete="off"><span class="input-label">Permanent Residence Address</span></label><div class="suggestions" id="suggestions"><button class="suggestion" data-address="21 Queen Street, Auckland CBD" type="button"><b>21 Queen Street, Auckland CBD</b><span>Auckland 1010 · New Zealand</span></button><button class="suggestion" data-address="21 Queen Street, Onehunga" type="button"><b>21 Queen Street, Onehunga</b><span>Auckland 1061 · New Zealand</span></button></div></div></section>
    <section class="overlay" id="choiceOverlay"><div class="sheet"><div class="sheet__handle"></div><h2 id="choiceTitle">Select</h2><div id="choiceList"></div></div></section>
  </section>
  <script>
    const $=s=>document.querySelector(s),address=$('#address'),addressOverlay=$('#addressOverlay'),addressSearch=$('#addressSearch');
    const open=el=>el.classList.add('open'),close=el=>el.classList.remove('open');
    document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)close(el)}));
    $('#proofCard').onclick=()=>open($('#proofOverlay'));
    $('#proofUpload').onclick=()=>$('.proof-sheet').classList.add('ready');
    $('#applyAddress').onclick=()=>{address.value='21 Queen Street, Auckland CBD, Auckland 1010';close($('#proofOverlay'))};
    $('#searchManual').onclick=()=>{close($('#proofOverlay'));setTimeout(()=>{open(addressOverlay);addressSearch.focus()},160)};
    address.onfocus=()=>{addressSearch.value=address.value;open(addressOverlay);setTimeout(()=>addressSearch.focus(),0)};
    addressSearch.oninput=()=>$('#suggestions').classList.toggle('show',addressSearch.value.trim().length>0);
    $('#suggestions').onclick=e=>{const row=e.target.closest('.suggestion');if(!row)return;address.value=row.dataset.address;close(addressOverlay)};
    function chooser(title,items,apply){$('#choiceTitle').textContent=title;$('#choiceList').innerHTML=items.map(x=>`<button class="choice" type="button" data-value="${x}"><span>${x}</span><b>✓</b></button>`).join('');open($('#choiceOverlay'));$('#choiceList').onclick=e=>{const row=e.target.closest('.choice');if(!row)return;apply(row.dataset.value);close($('#choiceOverlay'))}}
    $('#countryCode').onclick=()=>chooser('Country / Region',['+86','+852','+886','+65','+1','+64'],v=>{$('#countryCode').childNodes[0].nodeValue=v+' '});
    $('#reason').onclick=()=>chooser('Reason for different phone and residence regions',['Family Reason','Work Reason','Study Reason','Travel Reason','Other'],v=>$('#reason span').textContent=v);
  </script>
</body>
</html>
